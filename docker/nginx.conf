user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        server_name _;

        location = /healthz {
            auth_basic off;
            proxy_pass http://127.0.0.1:8765/healthz;
            proxy_set_header Host $host;
        }

        # OAuth state and PKCE protect this callback; never log its code/query.
        location = /callback {
            auth_basic off;
            access_log off;
            error_log /dev/null crit;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            proxy_set_header Authorization "";
            proxy_pass http://127.0.0.1:8766/callback;
            proxy_intercept_errors on;
            error_page 502 504 =503 @oauth_inactive;
        }

        location @oauth_inactive {
            access_log off;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            default_type text/plain;
            return 503 "No Robinhood login is waiting. Return to Relay Monitor Setup and start the login again.\n";
        }

        location = /browser/websockify {
            auth_basic "Discord options relay";
            auth_basic_user_file /etc/nginx/.htpasswd;
            set $vnc_origin_ok 0;
            if ($http_origin = "http://$http_host") { set $vnc_origin_ok 1; }
            if ($http_origin = "https://$http_host") { set $vnc_origin_ok 1; }
            if ($vnc_origin_ok = 0) { return 403; }
            proxy_pass http://127.0.0.1:6080/websockify;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
        }

        location ^~ /browser/websockify/ {
            auth_basic "Discord options relay";
            auth_basic_user_file /etc/nginx/.htpasswd;
            set $vnc_origin_ok 0;
            if ($http_origin = "http://$http_host") { set $vnc_origin_ok 1; }
            if ($http_origin = "https://$http_host") { set $vnc_origin_ok 1; }
            if ($vnc_origin_ok = 0) { return 403; }
            proxy_pass http://127.0.0.1:6080/websockify/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 1h;
        }

        location ^~ /browser/ {
            auth_basic "Discord options relay";
            auth_basic_user_file /etc/nginx/.htpasswd;
            if ($http_upgrade != "") { return 403; }
            proxy_pass http://127.0.0.1:6080/;
            proxy_set_header Host $host;
        }

        location / {
            auth_basic "Discord options relay";
            auth_basic_user_file /etc/nginx/.htpasswd;
            proxy_pass http://127.0.0.1:8765;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
