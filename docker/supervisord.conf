[unix_http_server]
file=/run/supervisor.sock
chmod=0700
chown=root:root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/relay-supervisor.log
logfile_maxbytes=1MB
logfile_backups=1
pidfile=/run/supervisord.pid
user=root

[eventlistener:telemetry-output]
command=/opt/venv/bin/python -m relay.telemetry_logs
directory=/app
priority=6
events=PROCESS_LOG_STDOUT,PROCESS_LOG_STDERR,TICK_5
buffer_size=512
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/telemetry-protocol.log
stdout_logfile_maxbytes=64KB
stdout_logfile_backups=1
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:telemetry-collector]
command=/opt/venv/bin/python -m relay.telemetry_collector
directory=/app
environment=GOMEMLIMIT="384MiB",GOMAXPROCS="2"
priority=5
autostart=true
autorestart=unexpected
startretries=3
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xvfb]
stdout_events_enabled=true
command=/usr/bin/Xvfb :99 -screen 0 1600x1000x24 -ac -nolisten tcp
priority=10
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
stdout_events_enabled=true
command=/usr/bin/openbox --sm-disable
directory=/home/relay
user=relay
environment=DISPLAY=":99",HOME="/home/relay"
priority=20
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
stdout_events_enabled=true
command=/usr/bin/x11vnc -display :99 -rfbport 5900 -localhost -forever -shared -nopw -noxdamage
priority=30
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:websockify]
stdout_events_enabled=true
command=/usr/bin/websockify --web=/usr/share/novnc --heartbeat=30 127.0.0.1:6080 127.0.0.1:5900
priority=40
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dashboard]
command=/opt/venv/bin/python -m relay.telemetry_exec dashboard --config /data/config.json --host 127.0.0.1 --port 8765 --enable-setup
stdout_events_enabled=true
directory=/app
user=relay
environment=HOME="/home/relay",CODEX_HOME="/data/codex",DISPLAY=":99",PLAYWRIGHT_BROWSERS_PATH="/ms-playwright",BROWSER="%(ENV_BROWSER)s"
priority=50
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:service]
command=/opt/venv/bin/python -m relay.telemetry_exec service --config /data/config.json
stdout_events_enabled=true
directory=/app
user=relay
environment=HOME="/home/relay",CODEX_HOME="/data/codex",DISPLAY=":99",PLAYWRIGHT_BROWSERS_PATH="/ms-playwright",BROWSER="%(ENV_BROWSER)s"
priority=60
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:notifications]
command=/opt/venv/bin/python -m relay.telemetry_exec notifications --config /data/config.json
stdout_events_enabled=true
directory=/app
user=relay
environment=HOME="/home/relay"
priority=70
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
stdout_events_enabled=true
command=/usr/sbin/nginx -g "daemon off;"
priority=90
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
