[unix_http_server]
file=/run/supervisor.sock
chmod=0700
chown=root:root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/run/supervisord.pid
user=root

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 1600x1000x24 -ac -nolisten tcp
priority=10
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
command=/usr/bin/openbox --sm-disable
directory=/home/relay
user=relay
environment=DISPLAY=":99",HOME="/home/relay"
priority=20
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -rfbport 5900 -localhost -forever -shared -nopw -noxdamage
priority=30
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:websockify]
command=/usr/bin/websockify --web=/usr/share/novnc --heartbeat=30 127.0.0.1:6080 127.0.0.1:5900
priority=40
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dashboard]
command=/opt/venv/bin/python -m relay.dashboard --config /data/config.json --host 127.0.0.1 --port 8765 --enable-setup
directory=/app
user=relay
environment=HOME="/home/relay",CODEX_HOME="/data/codex",DISPLAY=":99",PLAYWRIGHT_BROWSERS_PATH="/ms-playwright",BROWSER="%(ENV_BROWSER)s"
priority=50
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:service]
command=/opt/venv/bin/python -m relay.service --config /data/config.json
directory=/app
user=relay
environment=HOME="/home/relay",CODEX_HOME="/data/codex",DISPLAY=":99",PLAYWRIGHT_BROWSERS_PATH="/ms-playwright",BROWSER="%(ENV_BROWSER)s"
priority=60
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:notifications]
command=/opt/venv/bin/python -m relay.notifications --config /data/config.json
directory=/app
user=relay
environment=HOME="/home/relay"
priority=70
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
priority=90
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
