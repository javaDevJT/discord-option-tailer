[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-options-relay"
version = "0.1.0"
description = "Personal Discord monitoring, subscription-backed Codex interpretation, and account-aware option execution"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1"]

[project.optional-dependencies]
discord = ["discord.py-self==2.1.0"]
browser = ["playwright>=1.51,<2"]
robinhood = ["mcp>=1.28,<2", "jsonschema>=4.23,<5", "exchange-calendars>=4.13,<5"]
telemetry = [
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
  "opentelemetry-instrumentation-httpx==0.66b1",
  "opentelemetry-instrumentation-aiohttp-client==0.66b1",
  "opentelemetry-instrumentation-sqlite3==0.66b1",
  "opentelemetry-instrumentation-urllib==0.66b1",
]
telemetry-test = ["supervisor==4.3.0"]

[project.scripts]
options-relay = "relay.cli:main"

[tool.setuptools.packages.find]
include = ["relay*"]

[tool.setuptools.package-data]
relay = ["static/*.html", "static/*.css", "static/*.js", "schema-contracts.json"]
