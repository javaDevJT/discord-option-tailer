name: Test and publish image

on:
  schedule:
    - cron: '22 0 * * *'
      timezone: America/Detroit
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/javadevjt/discord-option-tailer

jobs:
  test:
    name: Test and secret scan
    runs-on: ubuntu-latest
    steps:
      # Pins verified against the upstream action repositories on 2026-09-08.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner .

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: python -m pip install -e '.[browser,robinhood,discord]'

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Check dashboard JavaScript syntax
        run: node --check relay/static/app.js

      - name: Run synthetic test suite
        run: python -m unittest discover -s tests -v

  build:
    name: Build and scan linux/amd64 image
    needs: test
    if: >-
      github.repository == 'javaDevJT/discord-option-tailer' &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: truenas-discord-option-tailer-storage-11g
    permissions:
      contents: read
      packages: read
    outputs:
      candidate_artifact_id: ${{ steps.candidate.outputs.artifact-id }}
    env:
      BUILDKIT_HOST: tcp://buildkit:1234
      BUILDKIT_TLS_CA_CERT: /run/buildkit/tls/ca.pem
      BUILDKIT_TLS_CLIENT_CERT: /run/buildkit/tls/client.pem
      BUILDKIT_TLS_CLIENT_KEY: /run/buildkit/tls/client.key
    steps:
      # Storage admission, sampling and pressure enforcement belong to the
      # administrator-installed runner hooks, independent of repository steps.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: remote
          endpoint: tcp://buildkit:1234
          driver-opts: |
            cacert=/run/buildkit/tls/ca.pem
            cert=/run/buildkit/tls/client.pem
            key=/run/buildkit/tls/client.key

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.source=https://github.com/javaDevJT/discord-option-tailer
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Prepare disk build cache
        id: ci_disk_cache_1
        run: ci-cache "truenas-05c856d3df3df362"
      - name: Prepare immutable image and release tags
        id: container_security_1
        shell: bash
        env:
          SECURITY_PUBLISH: "true"
          SECURITY_RELEASE_TAGS: |
            ${{ steps.meta.outputs.tags }}
          SECURITY_REPORT_DIRECTORY: ${{ runner.temp }}/container-security/build-1
        run: bash .github/actions/container-security/container-security.sh prepare
      - name: Build local image archive
        id: container_build_1
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          outputs: ${{ steps.container_security_1.outputs.exporter }}
          cache-from: |
            type=local,src=${{ steps.ci_disk_cache_1.outputs.from }}
            type=gha,version=2,scope=truenas-05c856d3df3df362
          cache-to: ${{ steps.ci_disk_cache_1.outputs.to && format('type=local,dest={0},mode=max,ignore-error=true', steps.ci_disk_cache_1.outputs.to) || '' }}
          context: .
          file: ./Dockerfile
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          platforms: linux/amd64
          no-cache-filters: runtime
          pull: true
          push: false
          labels: ${{ steps.meta.outputs.labels }}
      - name: Generate SBOM and enforce High/Critical vulnerability gate
        uses: ./.github/actions/container-security
        with:
          archive: ${{ steps.container_security_1.outputs.archive }}
          platforms: "linux/amd64"
          report-directory: ${{ runner.temp }}/container-security/build-1
          artifact-name: container-security-${{ github.job }}-${{ strategy.job-index || 0 }}-build-1

      - name: Retain scanned candidate for gated publication
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanned-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.container_security_1.outputs.archive }}
            ${{ runner.temp }}/container-security/build-1/
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish verified linux/amd64 image
    # The administrator's completion hook must pass before external publication.
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate candidate artifact identity
        shell: bash
        env:
          CANDIDATE_ARTIFACT_ID: ${{ needs.build.outputs.candidate_artifact_id }}
        run: '[[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'

      - name: Download exact scanned candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/container-security
          merge-multiple: true
          digest-mismatch: error

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install verified OCI publication tool
        shell: bash
        env:
          ORAS_VERSION: 1.3.4
          ORAS_SHA256: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/oras.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ORAS_SHA256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/oras"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/oras" oras

      - name: Publish scanned archive only after all gates pass
        shell: bash
        env:
          SECURITY_ARCHIVE: ${{ runner.temp }}/container-security/build-1.oci.tar
          SECURITY_PLATFORMS: linux/amd64
          ORAS_CMD: ${{ runner.temp }}/oras/oras
          SECURITY_REPORT_DIRECTORY: ${{ runner.temp }}/container-security/build-1
        run: bash .github/actions/container-security/container-security.sh publish

      - name: Retain image publication receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/container-security/build-1/scanned-archive.sha256
            ${{ runner.temp }}/container-security/build-1/scanned-image-digest.txt
            ${{ runner.temp }}/container-security/build-1/release-tags.txt
            ${{ runner.temp }}/container-security/build-1/published-digests.txt
          if-no-files-found: warn
          retention-days: 14
