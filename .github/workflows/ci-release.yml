name: Test and publish image

on:
  schedule:
    - cron: '22 0 * * *'
      timezone: America/Detroit
  push:
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_RETENTION_DAYS: "1"
  IMAGE_NAME: ghcr.io/javadevjt/discord-option-tailer

  DOCKER_BUILD_RECORD_UPLOAD: "false"
jobs:
  test:
    name: Test and secret scan
    if: >-
      github.repository == 'javaDevJT/discord-option-tailer' &&
      (github.event_name != 'pull_request_target' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        ((github.actor == 'javaDevJT' && github.event.pull_request.user.login == 'javaDevJT') ||
         (github.actor == 'quarterback-ci[bot]' && github.event.pull_request.user.id == 341165314) ||
         (github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.user.id == 49699333))))
    runs-on: truenas-discord-option-tailer-storage-11g
    env:
      BUILDKIT_HOST: tcp://buildkit:1234
      BUILDKIT_TLS_CA_CERT: /run/buildkit/tls/ca.pem
      BUILDKIT_TLS_CLIENT_CERT: /run/buildkit/tls/client.pem
      BUILDKIT_TLS_CLIENT_KEY: /run/buildkit/tls/client.key
    steps:
      # Pins verified against the upstream action repositories on 2026-09-08.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history for secrets
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          printf '%s  %s\n' "${GITLEAKS_SHA256}" "${RUNNER_TEMP}/${archive}" | sha256sum --check
          tar --extract --gzip --file "${RUNNER_TEMP}/${archive}" --directory "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner .

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e '.[browser,robinhood,discord]'

      - name: Check dashboard JavaScript syntax
        run: node --check relay/static/app.js

      - name: Test unprivileged Chromium dependency staging
        run: node --test .github/scripts/test-install-browser-deps.mjs

      - name: Stage Chromium system libraries without changing the runner
        run: node .github/scripts/install-browser-deps.mjs

      - name: Install Playwright Chromium
        run: python -m playwright install chromium

      - name: Run synthetic test suite
        run: python -m unittest discover -s tests -v

      - name: Remove temporary browser dependencies and secret-scan binary
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          staged_roots=( "$RUNNER_TEMP"/discord-playwright-deps-* )
          if (( ${#staged_roots[@]} )); then
            rm -rf -- "${staged_roots[@]}"
          fi
          rm -f -- "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"

  build:
    name: Build and scan linux/amd64 image
    needs: test
    if: >-
      github.repository == 'javaDevJT/discord-option-tailer' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request_target'
    runs-on: truenas-discord-option-tailer-storage-11g
    permissions:
      contents: read
      packages: read
    outputs:
      candidate_artifact_id: ${{ steps.candidate.outputs.artifact-id }}
    env:
      BUILDKIT_HOST: tcp://buildkit:1234
      BUILDKIT_TLS_CA_CERT: /run/buildkit/tls/ca.pem
      BUILDKIT_TLS_CLIENT_CERT: /run/buildkit/tls/client.pem
      BUILDKIT_TLS_CLIENT_KEY: /run/buildkit/tls/client.key
    steps:
      # Storage admission, sampling and pressure enforcement belong to the
      # administrator-installed runner hooks, independent of repository steps.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure temporary Docker credentials
        shell: bash
        run: |
          set -euo pipefail
          printf 'DOCKER_CONFIG=%s/docker-config\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up Python for security and release checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Log in to Docker Hub
        if: ${{ github.repository == 'javaDevJT/discord-option-tailer' && (github.event_name != 'pull_request' && github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          cache-binary: false
          driver: remote
          endpoint: tcp://buildkit:1234
          driver-opts: |
            cacert=/run/buildkit/tls/ca.pem
            cert=/run/buildkit/tls/client.pem
            key=/run/buildkit/tls/client.key

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.source=https://github.com/javaDevJT/discord-option-tailer
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Prepare disk build cache
        id: ci_disk_cache_1
        run: ci-cache "truenas-05c856d3df3df362"
      - name: Prepare immutable image and release tags
        id: container_security_1
        shell: bash
        env:
          SECURITY_PUBLISH: "true"
          SECURITY_RELEASE_TAGS: |
            ${{ steps.meta.outputs.tags }}
          SECURITY_REPORT_DIRECTORY: ${{ runner.temp }}/container-security/build-1
        run: bash .github/actions/container-security/container-security.sh prepare
      - name: Build local image archive
        id: container_build_1
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          outputs: ${{ steps.container_security_1.outputs.exporter }}
          cache-from: |
            type=local,src=${{ steps.ci_disk_cache_1.outputs.from }}
          cache-to: ${{ steps.ci_disk_cache_1.outputs.to && format('type=local,dest={0},mode=max,ignore-error=true', steps.ci_disk_cache_1.outputs.to) || '' }}
          context: .
          file: ./Dockerfile
          build-args: |
            QB_SOURCE_COMMIT=${{ github.sha }}
          platforms: linux/amd64
          no-cache-filters: runtime
          pull: true
          push: false
          labels: ${{ steps.meta.outputs.labels }}
      - name: Generate SBOM and enforce High/Critical vulnerability gate
        uses: ./.github/actions/container-security
        with:
          archive: ${{ steps.container_security_1.outputs.archive }}
          platforms: "linux/amd64"
          report-directory: ${{ runner.temp }}/container-security/build-1
          artifact-name: security-high-critical-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Retain scanned candidate for gated publication
        id: candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanned-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.container_security_1.outputs.archive }}
            ${{ runner.temp }}/container-security/build-1/gate.txt
            ${{ runner.temp }}/container-security/build-1/scanned-archive.sha256
            ${{ runner.temp }}/container-security/build-1/scanned-image-digest.txt
            ${{ runner.temp }}/container-security/build-1/scanned-oci-reference.txt
            ${{ runner.temp }}/container-security/build-1/requested-platforms.txt
            ${{ runner.temp }}/container-security/build-1/release-tags.txt
            ${{ runner.temp }}/container-security/build-1/release-tags.sha256
            ${{ runner.temp }}/container-security/build-1/repository.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

      - name: Remove local OCI candidate and registry credentials
        if: ${{ always() }}
        shell: bash
        env:
          SECURITY_ARCHIVE: ${{ steps.container_security_1.outputs.archive }}
          SECURITY_REPORT_DIRECTORY: ${{ runner.temp }}/container-security/build-1
        run: |
          set -euo pipefail
          if [[ -n "$SECURITY_ARCHIVE" ]]; then
            rm -f -- "$SECURITY_ARCHIVE"
          fi
          rm -rf -- "$SECURITY_REPORT_DIRECTORY" "$DOCKER_CONFIG"
          rmdir "$RUNNER_TEMP/container-security" 2>/dev/null || true

  publish:
    name: Publish verified linux/amd64 image
    # The administrator's completion hook must pass before external publication.
    needs: [test, build]
    if: github.repository == 'javaDevJT/discord-option-tailer' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request_target'
    runs-on: truenas-discord-option-tailer-storage-11g
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure temporary Docker credentials
        shell: bash
        run: |
          set -euo pipefail
          printf 'DOCKER_CONFIG=%s/docker-config\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up Python for release checks
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate candidate artifact identity
        shell: bash
        env:
          CANDIDATE_ARTIFACT_ID: ${{ needs.build.outputs.candidate_artifact_id }}
        run: '[[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'

      - name: Download exact scanned candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/container-security
          merge-multiple: true
          digest-mismatch: error

      - name: Install verified OCI publication tool
        shell: bash
        env:
          ORAS_VERSION: 1.3.4
          ORAS_SHA256: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/oras.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/oras-project/oras/releases/download/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ORAS_SHA256" "$archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/oras"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/oras" oras

      - name: Log in to GHCR for native OCI publication
        shell: bash
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | "$RUNNER_TEMP/oras/oras" login ghcr.io \
            --username "$GHCR_USERNAME" --password-stdin

      - name: Publish scanned archive only after all gates pass
        shell: bash
        env:
          SECURITY_ARCHIVE: ${{ runner.temp }}/container-security/build-1.oci.tar
          SECURITY_PLATFORMS: linux/amd64
          ORAS_CMD: ${{ runner.temp }}/oras/oras
          SECURITY_REPORT_DIRECTORY: ${{ runner.temp }}/container-security/build-1
        run: bash .github/actions/container-security/container-security.sh publish

      - name: Emit verified build receipt marker
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PUBLISHED_DIGESTS: ${{ runner.temp }}/container-security/build-1/published-digests.txt
          SCANNED_DIGEST_FILE: ${{ runner.temp }}/container-security/build-1/scanned-image-digest.txt
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ -s "$SCANNED_DIGEST_FILE" && -s "$PUBLISHED_DIGESTS" ]]
          read -r scanned_digest < "$SCANNED_DIGEST_FILE"
          [[ "$scanned_digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          rows=0
          while read -r published_tag published_digest extra; do
            [[ -n "$published_tag" && -z "${extra:-}" ]]
            [[ "$published_tag" =~ ^ghcr\.io/[a-zA-Z0-9._/-]+:[a-zA-Z0-9_.-]+$ ]]
            [[ "$published_digest" == "$scanned_digest" ]]
            rows=$((rows + 1))
          done < "$PUBLISHED_DIGESTS"
          (( rows > 0 ))
          printf 'QB_BUILD_RECEIPT_V1 source_sha=%s run_id=%s run_attempt=%s digest=%s\n' \
            "$SOURCE_SHA" "$RUN_ID" "$RUN_ATTEMPT" "$scanned_digest"

      - name: Record publication receipts and remove local handoff
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          receipt_directory="$RUNNER_TEMP/container-security/build-1"
          for receipt in scanned-image-digest.txt release-tags.txt published-digests.txt; do
            if [[ -s "$receipt_directory/$receipt" ]]; then
              printf '\n%s\n' "Publication receipt: $receipt"
              cat "$receipt_directory/$receipt"
            fi
          done
          rm -f -- \
            "$RUNNER_TEMP/container-security/build-1.oci.tar" \
            "$RUNNER_TEMP/oras.tar.gz"
          rm -rf -- \
            "$receipt_directory" \
            "$RUNNER_TEMP/oras" \
            "$DOCKER_CONFIG"
          rmdir "$RUNNER_TEMP/container-security" 2>/dev/null || true

      - name: Delete consumed scanned candidate artifact
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.build.outputs.candidate_artifact_id }}
        run: |
          set -euo pipefail
          if [[ -z "$CANDIDATE_ARTIFACT_ID" ]]; then
            exit 0
          fi
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          curl --fail --silent --show-error --request DELETE \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$CANDIDATE_ARTIFACT_ID"

  cleanup-artifacts:
    name: Remove transient build artifacts
    needs: ["test","build","publish"]
    if: ${{ always() && github.event_name != 'pull_request_target' }}
    runs-on: truenas-discord-option-tailer-storage-8g
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out trusted default branch cleanup code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python for bounded cleanup
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Delete non-retained current-run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/cleanup-actions-artifacts.py --current

